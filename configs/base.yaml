name: base
society:
  n_agents: 100
  rounds: 30
  activation_prob: 0.4
  probe_every: 5
  feed_size: 10
  memory_k: 10
  topology: barabasi_albert
  topology_kw: {m: 3}
  w_interest: 1.0
  w_hot: 0.5
composition:
  mu: {openness: 0.5, conscientiousness: 0.5, extraversion: 0.5, agreeableness: 0.5, neuroticism: 0.5}
  sigma: 0.15
  corr: independent
induction:
  arm: prompt          # prompt | tags (tags requires the QLoRA adapter served via vLLM --enable-lora)
llm:
  backend: vllm        # vllm | mock (mock = demo-scale integration testing ONLY)
  base_url: http://localhost:8000/v1
  model: meta-llama/Llama-3.1-8B-Instruct
  max_workers: 32
  temperature: 0.7
topics:
  source: default      # notebook 01 writes data/topics/topics.json (Chuang set + ANES statements)
ci:
  n_estimation: 6
  est_pre_rounds:  [8, 8, 8, 20, 20, 20]
  est_post_rounds: [14, 14, 14, 26, 26, 26]
  n_hidden_profile: 2
  hp_pre_rounds:  [10, 22]
  hp_post_rounds: [16, 28]
  require_truths: true
